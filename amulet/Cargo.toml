[package]
name = "amulet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "amulet"

[dependencies]
minhook = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }