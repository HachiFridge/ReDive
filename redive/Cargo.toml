[package]
name = "redive"
version = "0.1.0"
edition = "2021"

[dependencies]
senbei-engine = { git = "https://github.com/Tenshou170/Senbei.git" }
senbei-io = { git = "https://github.com/Tenshou170/Senbei.git" }
senbei-metadata = { git = "https://github.com/Tenshou170/Senbei.git" }
sha2 = "0.10"
walkdir = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
